<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="auth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#auth-grad)" />

  <!-- Inner Dark Shield -->
  <path d="M 50 18 L 78 30 C 78 58 64 76 50 82 C 36 76 22 58 22 30 Z" fill="#0f172a" opacity="0.35" />
  
  <!-- Glowing Lock Body -->
  <rect x="36" y="46" width="28" height="24" rx="5" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Lock Shackle -->
  <path d="M 42 46 V 37 A 8 8 0 0 1 58 37 V 46" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" />
  
  <!-- Keyhole -->
  <circle cx="50" cy="55" r="2.5" fill="#9333ea" />
  <path d="M 48.5 56.5 L 51.5 56.5 L 52 63 L 48 63 Z" fill="#9333ea" />
</svg>
